name: MLOps LLMOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Set up SSH Key & Deploy to EC2
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
        chmod 600 private_key.pem
        
        # EC2 ke andar Docker aur K3s setup aur manifests chalana
        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
          sudo apt-get update && sudo apt-get install -y docker.io
          curl -sfL https://k3s.io | sh -
          sudo chmod 644 /etc/rancher/k3s/k3s.yaml
          
          # GitHub se manifests khinch kar apply karna (Ya direct apply logic)
          echo "Pipeline Connected Successfully!"
        EOF